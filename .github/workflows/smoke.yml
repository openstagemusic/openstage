name: Smoke

# Il test che deve restare verde: le pagine pubbliche rispondono, hanno titolo e
# h1, la lingua giusta e nessun errore in console (idratazione compresa).
#
# Non fa login e non pubblica niente: quelle prove si fanno a mano nel beta test.
# Gira **contro la produzione**, quindi non ha bisogno di segreti: se
# getopenstage.it è rotta, il workflow diventa rosso.
#
# Su `push` il deploy di Vercel parte nello stesso momento: prima di misurare si
# aspetta che la produzione serva la build nuova (gli header di sicurezza sono il
# segnale più semplice: ci sono da questa versione in poi).
#
# I controlli falliti finiscono nel riepilogo del job, così si leggono senza
# aprire i log.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Ogni mattina alle 06:00 UTC: un sito che si sveglia rotto si scopre così.
    - cron: "0 6 * * *"

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci --ignore-scripts

      - name: Chrome per Puppeteer
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome"
          CHROME_BIN=$(find "$RUNNER_TEMP/chrome" -type f -name chrome -perm -u+x | head -n 1)
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Chrome: $CHROME_BIN"
          "$CHROME_BIN" --version

      - name: Aspetta che la produzione serva la build nuova
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 40); do
            headers=$(curl -sI https://getopenstage.it/it || true)
            if echo "$headers" | grep -qi "^x-frame-options: DENY" \
              && echo "$headers" | grep -qi "^x-content-type-options: nosniff"; then
              echo "Produzione aggiornata (tentativo $attempt)."
              exit 0
            fi
            sleep 15
          done
          echo "La produzione non ha ancora gli header attesi dopo 10 minuti."
          exit 1

      - name: Smoke sulla produzione
        run: node scripts/smoke.mjs
        env:
          BASE_URL: https://getopenstage.it
          SMOKE_TIMEOUT_MS: "60000"
