<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0B0B12;color:#fff;font-family:Inter,Arial,sans-serif}
.page{width:1800px;height:920px;padding:56px 70px;box-sizing:border-box}
h1{font-size:26px;font-weight:600;margin:0 0 6px}
p.sub{color:#8A8AA8;font-size:14px;margin:0 0 36px}
.row{display:flex;gap:56px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px}
.label{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;color:#8A8AA8;text-transform:uppercase}
.box{border:1px solid #22222F;background:#07070D}
.circle{border-radius:50%;overflow:hidden;border:1px solid #22222F}
.small{display:flex;align-items:flex-end;gap:22px;margin-top:6px}
img{display:block}
.wordmark{width:1080px;border:1px solid #22222F}
.note{font-size:12px;color:#8A8AA8;line-height:1.6;max-width:420px}
</style></head><body><div class="page">
<h1>OpenStage — sistema di marca</h1>
<p class="sub">Monogramma O/S, avatar Spotify, copertina playlist, wordmark</p>
<div class="row">
  <div class="col">
    <div class="label">Icona / avatar 1000</div>
    <div class="box"><img src="file:///C:/open%20stage/docs/brand/final/openstage-icon.svg" width="360" height="360"></div>
    <div class="label">Ritaglio Spotify</div>
    <div class="small">
      <div class="circle"><img src="file:///C:/open%20stage/docs/brand/final/openstage-icon.svg" width="180" height="180"></div>
      <div class="circle"><img src="file:///C:/open%20stage/docs/brand/final/openstage-icon.svg" width="96" height="96"></div>
      <div class="circle"><img src="file:///C:/open%20stage/docs/brand/final/openstage-icon.svg" width="48" height="48"></div>
      <div class="circle"><img src="file:///C:/open%20stage/docs/brand/final/openstage-icon.svg" width="28" height="28"></div>
    </div>
  </div>
  <div class="col">
    <div class="label">Copertina playlist 1000</div>
    <div class="box"><img src="file:///C:/open%20stage/docs/brand/final/openstage-playlist-vol1.svg" width="430" height="430"></div>
  </div>
  <div class="col">
    <div class="label">Wordmark</div>
    <div class="box wordmark"><img src="file:///C:/open%20stage/docs/brand/final/openstage-wordmark.svg" width="900"></div>
    <div class="note">Il monogramma resta leggibile a 28 px. Il punto rosa compare solo nella copertina e negli usi grandi, non nell'avatar.</div>
  </div>
</div>
</div></body></html>
